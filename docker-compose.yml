services:
  localdb:
    image: postgres:15.1
    ports:
      - "5432:5432"
    volumes:
      - ./db/dumps:/app-db-dumps
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=taqtile
      - POSTGRES_DB=taqtile_db

  testdb:
    image: postgres:15.1
    ports:
      - "5433:5432"
    volumes:
      - ./db/dumps:/app-db-dumps
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=taqtile
      - POSTGRES_DB=taqtile_test_db
